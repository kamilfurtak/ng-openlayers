name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['master']
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read

env:
  RELEASE_MESSAGE: 'chore(release): publish'

jobs:
  build:
    outputs:
      release_message: ${{ env.RELEASE_MESSAGE }}
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run test-ci
      - name: Cypress production browser regression tests
        run: npm run e2e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            coverage/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify packed library on Angular 22
        run: npm run test:consumer
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/apps/demo-ng-openlayers
  publish_to_npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for provenance data generation
    timeout-minutes: 10
    needs: build
    if: |
      github.event_name == 'push' && contains(github.event.head_commit.message, 'chore(release): publish')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        shell: bash

      - run: npm run build:lib

      - name: Print Environment Info
        run: npx nx report
        shell: bash

      - name: Publish packages
        run: |
          git config --global user.email "kamil@fcomp.dev"
          git config --global user.name "Kamil Furtak"
          npm run copy:lib:docs
          npx nx release publish
        shell: bash
  deploy-github-pages:
    name: Deploy to GitHub Pages
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
